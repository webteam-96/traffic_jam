services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trafficjam
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_USER: trafficjam
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
